name: Checks

on:
  push:
    paths:
      - "custom_components/**"
      - "tests/**"
      - "requirements-test.txt"
      - "hacs.json"
      - "LICENSE"
      - ".github/workflows/checks.yaml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run offline regression tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest tests -q -p no:cacheprovider --junitxml=test-results.xml
      - name: Annotate failures
        if: failure()
        run: 'echo "::error::Dependency installation or ha-certbot regression checks failed; inspect the failing step."'

  homeassistant:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install Home Assistant and integration dependencies
        run: python -m pip install homeassistant==2026.11.1 -r requirements-test.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Check real Home Assistant APIs and forms
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tests/ha_smoke.py
      - name: Annotate failures
        if: failure()
        run: 'echo "::error::Home Assistant 2026.11.1 compatibility smoke failed; inspect the failing step."'
